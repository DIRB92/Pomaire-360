<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pomaire360 - Guía Turística Interactiva</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet"/>
<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<script src="config.js"></script>
<style>
:root {
  --brown-dark: #1A0A00;
  --brown-mid: #2E1200;
  --terra: #B84A1E;
  --terra-light: #D4724A;
  --cream: #FAF6F0;
  --cream-mid: #F0E8DC;
  --cream-border: #E2D5C5;
  --text-dark: #1A0A00;
  --text-mid: #5A3820;
  --text-light: #9A7558;
  --gold: #C9933A;
  --shadow: 0 4px 12px rgba(0,0,0,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--cream); color: var(--text-dark); line-height: 1.5; }

#app { width: 100%; min-height: 100vh; display: flex; flex-direction: column; }

/* HEADER */
.header {
  background: linear-gradient(135deg, var(--brown-dark) 0%, var(--brown-mid) 100%);
  padding: 16px 24px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 3px solid var(--terra);
  position: sticky; top: 0; z-index: 100;
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo-badge {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--terra), var(--terra-light));
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 22px;
  box-shadow: 0 4px 12px rgba(184,74,30,0.4);
}
.logo-name { color: #fff; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
.logo-name span { color: var(--terra-light); }
.logo-sub { color: var(--text-light); font-size: 12px; margin-top: 2px; }

.header-right { display: flex; align-items: center; gap: 16px; }
.lang-btn {
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  color: #fff;
  padding: 6px 12px; border-radius: 8px; font-size: 12px;
  font-weight: 600; cursor: pointer; transition: all 0.2s;
}
.lang-btn.active, .lang-btn:hover { background: var(--terra); border-color: var(--terra); }

/* SEARCH & NAV */
.search-nav-container { background: #fff; border-bottom: 1px solid var(--cream-border); }
.search-wrap { padding: 12px 24px; display: flex; gap: 12px; align-items: center; }
.search-box {
  flex: 1; display: flex; align-items: center; gap: 10px;
  background: var(--cream); border: 1.5px solid var(--cream-border);
  border-radius: 12px; padding: 10px 16px; transition: all 0.2s;
}
.search-box:focus-within { border-color: var(--terra); background: #fff; box-shadow: 0 0 0 3px rgba(184,74,30,0.1); }
.search-box input { border: none; background: transparent; font-size: 14px; color: var(--text-dark); width: 100%; outline: none; }

.nav-scroll {
  display: flex; overflow-x: auto; padding: 0 24px; gap: 8px;
  scrollbar-width: none; background: #fff;
}
.nav-scroll::-webkit-scrollbar { display: none; }
.nav-item {
  padding: 12px 16px; font-size: 13px; font-weight: 600; color: var(--text-light);
  cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent;
  display: flex; align-items: center; gap: 8px; transition: all 0.2s;
}
.nav-item:hover { color: var(--terra); }
.nav-item.active { color: var(--terra); border-bottom-color: var(--terra); }
.nav-dot { width: 8px; height: 8px; border-radius: 50%; }

/* MAIN CONTENT */
.main-layout { display: flex; flex: 1; height: calc(100vh - 180px); overflow: hidden; }

/* MAP SIDE */
.map-container { flex: 1.2; position: relative; border-right: 1px solid var(--cream-border); }
#map { width: 100%; height: 100%; }
.map-overlay-info {
  position: absolute; top: 16px; left: 16px; z-index: 10;
  background: rgba(255,255,255,0.95); padding: 12px 16px;
  border-radius: 12px; box-shadow: var(--shadow); border: 1px solid var(--cream-border);
  max-width: 200px;
}
.overlay-title { font-size: 11px; font-weight: 800; color: var(--text-light); text-transform: uppercase; margin-bottom: 4px; }
.overlay-val { font-size: 14px; font-weight: 700; color: var(--text-dark); display: flex; align-items: center; gap: 6px; }

/* LIST SIDE */
.list-container { flex: 0.8; overflow-y: auto; background: var(--cream); padding: 24px; }
.list-header { margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
.list-title { font-size: 18px; font-weight: 800; color: var(--text-dark); }
.list-count { font-size: 12px; color: var(--text-light); font-weight: 600; background: var(--cream-mid); padding: 4px 10px; border-radius: 20px; }

.cards-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
.card {
  background: #fff; border-radius: 16px; padding: 16px; cursor: pointer;
  border: 1px solid var(--cream-border); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex; gap: 16px; align-items: center;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px rgba(0,0,0,0.06); border-color: var(--terra-light); }
.card-img {
  width: 60px; height: 60px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 24px; color: #fff; flex-shrink: 0;
}
.card-body { flex: 1; }
.card-name { font-size: 15px; font-weight: 700; color: var(--text-dark); margin-bottom: 2px; }
.card-type { font-size: 12px; color: var(--text-light); margin-bottom: 6px; }
.card-badge {
  display: inline-block; font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 6px;
}

/* POPUP CUSTOM */
.mapboxgl-popup-content { border-radius: 12px; padding: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: none; }
.popup-title { font-weight: 800; font-size: 14px; color: var(--text-dark); margin-bottom: 2px; }
.popup-sub { font-size: 12px; color: var(--text-light); }

/* MOBILE RESPONSIVE */
@media (max-width: 900px) {
  .main-layout { flex-direction: column; height: auto; overflow: visible; }
  .map-container { height: 400px; flex: none; }
  .list-container { flex: none; height: auto; }
}

</style>
</head>
<body>

<div id="app">
  <header class="header">
    <div class="logo">
      <div class="logo-badge"><i class="fa-solid fa-earth-americas"></i></div>
      <div>
        <div class="logo-name">Pomaire<span>360</span></div>
        <div class="logo-sub">Descubre el corazón de la greda · Chile</div>
      </div>
    </div>
    <div class="header-right">
      <button class="lang-btn active">ES</button>
      <button class="lang-btn">EN</button>
    </div>
  </header>

  <div class="search-nav-container">
    <div class="search-wrap">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-light)"></i>
        <input type="text" placeholder="Buscar talleres, restaurantes, estacionamientos..."/>
      </div>
    </div>
    <nav class="nav-scroll" id="navBar"></nav>
  </div>

  <main class="main-layout">
    <div class="map-container">
      <div id="map"></div>
      <div class="map-overlay-info">
        <div class="overlay-title">Explorando</div>
        <div class="overlay-val" id="currentCatDisplay">
          <div class="nav-dot" id="currentCatDot"></div>
          <span id="currentCatName">Cargando...</span>
        </div>
      </div>
    </div>

    <div class="list-container">
      <div class="list-header">
        <h2 class="list-title" id="sectionTitle">Puntos Clave</h2>
        <span class="list-count" id="sectionCount">0 lugares</span>
      </div>
      <div class="cards-grid" id="cardsGrid"></div>
    </div>
  </main>
</div>

<script>
// El token se carga desde el archivo config.js externo para mayor seguridad
const TOKEN = typeof MAPBOX_TOKEN !== 'undefined' ? MAPBOX_TOKEN : 'PON_TU_TOKEN_AQUI';

const cats = [
  {id:'destacados', label:'Destacados', icon:'fa-star', color:'#B84A1E'},
  {id:'alfareria', label:'Talleres y Greda', icon:'fa-fire', color:'#7B2D00'},
  {id:'comida', label:'Gastronomía', icon:'fa-utensils', color:'#C0392B'},
  {id:'servicios', label:'Servicios', icon:'fa-info-circle', color:'#1565C0'}
];

const places = {
  destacados: [
    {name:'Plaza de Pomaire', type:'Centro neurálgico', icon:'fa-landmark', color:'#B84A1E', badge:'Punto Cero', badgeBg:'#FDEEE8', badgeTx:'#7B2000', lat:-33.6208, lng:-71.1743},
    {name:'Restaurante San Antonio', type:'Tradición desde 1970', icon:'fa-utensils', color:'#C0392B', badge:'Famoso', badgeBg:'#FEECEC', badgeTx:'#7B0000', lat:-33.6210, lng:-71.1745},
    {name:'Espacio Greda', type:'Taller interactivo', icon:'fa-hands', color:'#7B2D00', badge:'Talleres', badgeBg:'#FFF3E0', badgeTx:'#7B3A00', lat:-33.6212, lng:-71.1748},
    {name:'Granja Educativa Alfarera', type:'Experiencia cultural', icon:'fa-cow', color:'#2E7D52', badge:'Familiar', badgeBg:'#E8F5E9', badgeTx:'#1B5E20', lat:-33.6200, lng:-71.1730},
    {name:'Calle Artesanos', type:'Paseo comercial', icon:'fa-shop', color:'#D4724A', badge:'Imperdible', badgeBg:'#FDEEE8', badgeTx:'#7B2000', lat:-33.6215, lng:-71.1750}
  ],
  alfareria: [
    {name:'Taller Familia Vera', type:'Alfarería tradicional', icon:'fa-fire', color:'#7B2D00', badge:'Maestros', badgeBg:'#FFF3E0', badgeTx:'#7B3A00', lat:-33.6218, lng:-71.1755},
    {name:'Horno de Greda Histórico', type:'Monumento local', icon:'fa-industry', color:'#8B3A0F', badge:'Patrimonio', badgeBg:'#FFF3E0', badgeTx:'#7B3A00', lat:-33.6220, lng:-71.1760},
    {name:'Tienda La Greda', type:'Utilitarios y decoración', icon:'fa-bag-shopping', color:'#A0522D', badge:'Variedad', badgeBg:'#FFF3E0', badgeTx:'#7B3A00', lat:-33.6208, lng:-71.1743}
  ],
  comida: [
    {name:'El Tambo', type:'Parrilladas y empanadas', icon:'fa-bowl-food', color:'#C0392B', badge:'Clásico', badgeBg:'#FEECEC', badgeTx:'#7B0000', lat:-33.6205, lng:-71.1740},
    {name:'La Cazuela de Barro', type:'Comida casera', icon:'fa-fire-burner', color:'#A93226', badge:'Tradicional', badgeBg:'#FEECEC', badgeTx:'#7B0000', lat:-33.6210, lng:-71.1746},
    {name:'Picada Don Choche', type:'Empanadas de kilo', icon:'fa-bread-slice', color:'#922B21', badge:'Popular', badgeBg:'#FEECEC', badgeTx:'#7B0000', lat:-33.6198, lng:-71.1730}
  ],
  servicios: [
    {name:'Estacionamiento Central', type:'Pagado y seguro', icon:'fa-square-parking', color:'#455A64', badge:'Seguro', badgeBg:'#ECEFF1', badgeTx:'#263238', lat:-33.6207, lng:-71.1742},
    {name:'Posta de Salud', type:'Urgencias', icon:'fa-kit-medical', color:'#B71C1C', badge:'24h', badgeBg:'#FEECEC', badgeTx:'#7B0000', lat:-33.6202, lng:-71.1735},
    {name:'Carabineros', type:'Seguridad', icon:'fa-shield-halved', color:'#1A237E', badge:'Emergencias', badgeBg:'#E8EAF6', badgeTx:'#1A237E', lat:-33.6206, lng:-71.1741}
  ]
};

let map, markers = [], activeCat = 'destacados';

function initNav() {
  const navBar = document.getElementById('navBar');
  cats.forEach(c => {
    const btn = document.createElement('div');
    btn.className = `nav-item ${c.id === activeCat ? 'active' : ''}`;
    btn.innerHTML = `<div class="nav-dot" style="background:${c.color}"></div>${c.label}`;
    btn.onclick = () => switchCat(c.id);
    navBar.appendChild(btn);
  });
}

function switchCat(id) {
  activeCat = id;
  document.querySelectorAll('.nav-item').forEach((btn, i) => {
    btn.classList.toggle('active', cats[i].id === id);
  });
  renderContent();
}

function renderContent() {
  const cat = cats.find(c => c.id === activeCat);
  const items = places[activeCat] || [];
  
  // Update Overlay
  document.getElementById('currentCatName').textContent = cat.label;
  document.getElementById('currentCatDot').style.background = cat.color;
  
  // Update List
  document.getElementById('sectionTitle').textContent = cat.label;
  document.getElementById('sectionCount').textContent = `${items.length} lugares`;
  
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = items.map(p => `
    <div class="card" onclick="focusPlace(${p.lat}, ${p.lng})">
      <div class="card-img" style="background:${p.color}"><i class="fa-solid ${p.icon}"></i></div>
      <div class="card-body">
        <div class="card-name">${p.name}</div>
        <div class="card-type">${p.type}</div>
        <span class="card-badge" style="background:${p.badgeBg};color:${p.badgeTx}">${p.badge}</span>
      </div>
      <i class="fa-solid fa-chevron-right" style="color: var(--cream-border)"></i>
    </div>
  `).join('');

  updateMarkers(items, cat.color, cat.icon);
}

function updateMarkers(items, color, icon) {
  markers.forEach(m => m.remove());
  markers = [];

  const bounds = new mapboxgl.LngLatBounds();

  items.forEach(p => {
    const el = document.createElement('div');
    el.className = 'custom-marker';
    el.innerHTML = `
      <div style="background:${color}; width:36px; height:36px; border-radius:50% 50% 50% 0; transform:rotate(-45deg); border:3px solid #fff; box-shadow:0 4px 10px rgba(0,0,0,0.2); display:flex; align-items:center; justify-content:center;">
        <i class="fa-solid ${p.icon}" style="transform:rotate(45deg); color:#fff; font-size:14px;"></i>
      </div>
    `;

    const marker = new mapboxgl.Marker({element: el, anchor: 'bottom'})
      .setLngLat([p.lng, p.lat])
      .setPopup(new mapboxgl.Popup({offset: 30, closeButton: false})
        .setHTML(`<div class="popup-title">${p.name}</div><div class="popup-sub">${p.type}</div>`))
      .addTo(map);
    
    markers.push(marker);
    bounds.extend([p.lng, p.lat]);
  });

  if (items.length > 0) {
    map.fitBounds(bounds, { padding: 60, maxZoom: 16 });
  }
}

function focusPlace(lat, lng) {
  map.flyTo({ center: [lng, lat], zoom: 17, speed: 1.2 });
}

// Initialize Mapbox
mapboxgl.accessToken = TOKEN;
map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/outdoors-v12',
  center: [-71.1743, -33.6208],
  zoom: 15.5,
  attributionControl: false
});

map.addControl(new mapboxgl.NavigationControl({showCompass: false}), 'top-right');

map.on('load', () => {
  initNav();
  renderContent();
});

</script>
</body>
</html>
