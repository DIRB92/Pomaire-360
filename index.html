<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomaire App con Panel</title>

<style>
body { margin:0; font-family:Arial; background:#f4f4f4; }

header {
    background:#8B4513;
    color:white;
    text-align:center;
    padding:15px;
}

#map { height:60vh; }

/* PANEL */
#panel {
    background:white;
    padding:20px;
}

input, select {
    width:100%;
    margin:5px 0;
    padding:8px;
}

button {
    padding:10px;
    background:#8B4513;
    color:white;
    border:none;
    margin-top:10px;
    cursor:pointer;
}
</style>
</head>

<body>

<header>
<h1>Pomaire App Turística</h1>
<p>Mapa + Panel de administración</p>
</header>

<div id="map"></div>

<!-- PANEL ADMIN -->
<div id="panel">
<h2>Agregar nuevo lugar</h2>

<input id="nombre" placeholder="Nombre del lugar">
<input id="lat" placeholder="Latitud (ej: -33.705)">
<input id="lng" placeholder="Longitud (ej: -71.142)">

<select id="categoria">
<option value="restaurante">🍽 Restaurante</option>
<option value="servicio">🏪 Servicio</option>
<option value="foto">📸 Fotospot</option>
<option value="tienda">🏺 Tienda</option>
</select>

<button onclick="guardarLugar()">Guardar lugar</button>
</div>

<script>
let map;
let markers = [];

function initMap() {
    map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: -33.705, lng: -71.142 },
        zoom: 16
    });

    cargarLugares();
}

/* GUARDAR */
function guardarLugar() {
    const nombre = document.getElementById("nombre").value;
    const lat = parseFloat(document.getElementById("lat").value);
    const lng = parseFloat(document.getElementById("lng").value);
    const categoria = document.getElementById("categoria").value;

    if (!nombre || isNaN(lat) || isNaN(lng)) {
        alert("Completa todos los campos correctamente");
        return;
    }

    let lugares = JSON.parse(localStorage.getItem("lugares")) || [];

    lugares.push({ nombre, lat, lng, categoria });

    localStorage.setItem("lugares", JSON.stringify(lugares));

    alert("✅ Lugar guardado");

    cargarLugares();
}

/* CARGAR */
function cargarLugares() {
    limpiarMarcadores();

    let lugares = JSON.parse(localStorage.getItem("lugares")) || [];

    lugares.forEach(lugar => {
        const marker = new google.maps.Marker({
            position: { lat: lugar.lat, lng: lugar.lng },
            map: map,
            title: lugar.nombre
        });

        const info = new google.maps.InfoWindow({
            content: `<b>${lugar.nombre}</b><br>${lugar.categoria}`
        });

        marker.addListener("click", () => info.open(map, marker));

        markers.push(marker);
    });
}

/* LIMPIAR */
function limpiarMarcadores() {
    markers.forEach(m => m.setMap(null));
    markers = [];
}
</script>

<!-- GOOGLE MAPS -->
<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyApDzthaKLe4ErDUpefWcSlOvk2ZMSPJMg&callback=initMap" async defer></script>

</body>
</html>
