<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selector de Ubicación — Pomaire 360</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, sans-serif; overflow: hidden; height: 100vh; }
#map { width: 100%; height: 100vh; }
.picker-banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: linear-gradient(135deg, #B85C2C, #D4654A);
  color: white; padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13px; box-shadow: 0 2px 10px rgba(0,0,0,.2);
}
.picker-banner strong { font-size: 14px; }
.picker-banner .coords {
  font-family: 'SF Mono', 'Consolas', monospace; font-size: 12px;
  background: rgba(255,255,255,.2); padding: 3px 8px; border-radius: 4px;
}
.picker-hint {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 1000;
  background: rgba(45, 26, 10, 0.9); color: white; padding: 10px 20px;
  border-radius: 30px; font-size: 13px; font-weight: 500;
  box-shadow: 0 4px 20px rgba(0,0,0,.3); pointer-events: none;
  transition: opacity .3s;
}
.picker-hint.hidden { opacity: 0; }
.marker-wrapper.is-featured { animation: none; }
.ref-tooltip { font-size: 12px; }

/* Category colors */
.popup-card { font-family: Inter, sans-serif; min-width: 180px; }
.popup-card h4 { margin: 0 0 4px; font-size: 14px; }
.popup-card p { margin: 2px 0; font-size: 12px; color: #5a4a3a; }
</style>
</head>
<body>

<div class="picker-banner">
  <div>
    <strong>📍 Selector de Ubicación</strong>
    <span style="opacity:.8; margin-left:8px;">Haz clic para fijar el punto</span>
  </div>
  <span class="coords" id="coordsDisplay">Sin coordenadas</span>
</div>

<div class="picker-hint" id="pickerHint">
  👆 Haz clic en el mapa para fijar la ubicación del negocio
</div>

<div id="map"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script>
(function() {
  'use strict';

  // === CONFIG ===
  var SUPABASE_URL = 'https://uuskvqtbsvtfsovcjazf.supabase.co';
  var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.' +
    'eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV1c2t2cXRic3Z0ZnNvdmNqYXpmIiwi' +
    'cm9sZSI6ImFub24iLCJpYXQiOjE3ODQ2ODU4NDIsImV4cCI6MjEwMDI2MTg0Mn0.' +
    'BbHI3ctSNg5msUnL9eENTNpOujQROAh6vUAZpFVcbBI';

  var CATEGORIES = {
    alfareria:        { color:'#B85C2C', icon:'🏺' },
    talleres:         { color:'#C96B3C', icon:'🎨' },
    restaurantes:     { color:'#D4622A', icon:'🍽️' },
    alojamiento:      { color:'#2F7A6B', icon:'🛏️' },
    comercio:         { color:'#7A5C40', icon:'🛍️' },
    servicios:        { color:'#5B6ABF', icon:'🔧' },
    estacionamientos: { color:'#3B7DD8', icon:'🅿️' },
    salud:            { color:'#E25555', icon:'🏥' },
    seguridad:        { color:'#5B6ABF', icon:'🚔' },
    banos:            { color:'#3B7DD8', icon:'🚻' },
    transporte:       { color:'#3B7DD8', icon:'🚌' },
    turismo:          { color:'#4A7C59', icon:'📍' }
  };

  // === Read initial coords and excludeSlug from URL params ===
  var params = new URLSearchParams(window.location.search);
  var initLat = parseFloat(params.get('lat')) || null;
  var initLng = parseFloat(params.get('lng')) || null;
  var excludeSlug = params.get('exclude') || null;

  // === MAP INIT ===
  var startPos = (initLat && initLng) ? [initLat, initLng] : [-33.6512, -71.1505];
  var startZoom = (initLat && initLng) ? 17 : 16;

  var map = L.map('map', { center: startPos, zoom: startZoom, zoomControl: true });

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19
  }).addTo(map);

  // === PICKER MARKER ===
  var pickerIcon = L.divIcon({
    className: 'picker-icon',
    html: '<div style="width:40px;height:40px;border-radius:50%;background:#E53E3E;border:4px solid white;box-shadow:0 3px 14px rgba(229,62,62,0.6);display:flex;align-items:center;justify-content:center;font-size:18px;">📍</div>',
    iconSize: [40, 40],
    iconAnchor: [20, 20]
  });

  var pickerMarker = null;

  if (initLat && initLng) {
    pickerMarker = L.marker([initLat, initLng], { icon: pickerIcon, draggable: true, zIndexOffset: 2000 }).addTo(map);
    pickerMarker.on('dragend', onMarkerMove);
    updateCoords(initLat, initLng);
    document.getElementById('pickerHint').classList.add('hidden');
  }

  // === MAP CLICK ===
  map.on('click', function(e) {
    var lat = e.latlng.lat;
    var lng = e.latlng.lng;

    if (pickerMarker) {
      pickerMarker.setLatLng([lat, lng]);
    } else {
      pickerMarker = L.marker([lat, lng], { icon: pickerIcon, draggable: true, zIndexOffset: 2000 }).addTo(map);
      pickerMarker.on('dragend', onMarkerMove);
    }

    updateCoords(lat, lng);
    sendToParent(lat, lng);
    document.getElementById('pickerHint').classList.add('hidden');
  });

  function onMarkerMove() {
    var pos = pickerMarker.getLatLng();
    updateCoords(pos.lat, pos.lng);
    sendToParent(pos.lat, pos.lng);
  }

  function updateCoords(lat, lng) {
    document.getElementById('coordsDisplay').textContent = lat.toFixed(6) + ', ' + lng.toFixed(6);
  }

  function sendToParent(lat, lng) {
    // Send coordinates to parent via postMessage
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({
        type: 'pomaire360-location-pick',
        lat: lat,
        lng: lng
      }, '*');
    }
  }

  // === LOAD REFERENCE MARKERS FROM SUPABASE ===
  function loadPlaces() {
    var url = SUPABASE_URL + '/rest/v1/negocios?select=nombre,slug,categoria,latitud,longitud,plan&latitud=not.is.null&longitud=not.is.null&activo=eq.true';

    fetch(url, {
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        'Accept': 'application/json'
      }
    })
    .then(function(res) { return res.json(); })
    .then(function(places) {
      places.forEach(function(place) {
        if (excludeSlug && place.slug === excludeSlug) return;
        if (!place.latitud || !place.longitud) return;

        var cat = CATEGORIES[place.categoria] || { color: '#888', icon: '📍' };
        var isFeatured = place.plan === 'premium' || place.plan === 'destacado';
        var size = isFeatured ? 32 : 26;
        var bg = isFeatured ? '#E6B246' : cat.color;

        var icon = L.divIcon({
          className: 'ref-marker',
          html: '<div style="background:' + bg + ';border:2px solid #fff;border-radius:50%;width:' + size + 'px;height:' + size + 'px;display:flex;align-items:center;justify-content:center;font-size:' + (isFeatured ? 14 : 11) + 'px;box-shadow:0 2px 6px rgba(0,0,0,0.3);opacity:0.75;">' + cat.icon + '</div>',
          iconSize: [size, size],
          iconAnchor: [size/2, size/2]
        });

        var marker = L.marker([place.latitud, place.longitud], { icon: icon, interactive: true, zIndexOffset: isFeatured ? 100 : 0 });
        marker.bindTooltip(place.nombre, { direction: 'top', offset: [0, -(size/2)] });
        marker.addTo(map);
      });
    })
    .catch(function(err) {
      console.warn('[Picker] Error cargando negocios:', err);
    });
  }

  loadPlaces();

  // === LISTEN FOR MESSAGES FROM PARENT (e.g. to set initial position) ===
  window.addEventListener('message', function(e) {
    if (e.data && e.data.type === 'pomaire360-set-location') {
      var lat = e.data.lat;
      var lng = e.data.lng;
      if (lat && lng) {
        if (pickerMarker) {
          pickerMarker.setLatLng([lat, lng]);
        } else {
          pickerMarker = L.marker([lat, lng], { icon: pickerIcon, draggable: true, zIndexOffset: 2000 }).addTo(map);
          pickerMarker.on('dragend', onMarkerMove);
        }
        map.setView([lat, lng], 17);
        updateCoords(lat, lng);
        document.getElementById('pickerHint').classList.add('hidden');
      }
    }
  });

})();
</script>
</body>
</html>
