<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" width="2400" height="1600">
  <defs>
    <!-- Texturas y patrones rústicos -->
    <pattern id="grass" patternUnits="userSpaceOnUse" width="40" height="40">
      <rect width="40" height="40" fill="#5a9e4a"/>
      <circle cx="10" cy="10" r="1.5" fill="#4a8e3a" opacity=".5"/>
      <circle cx="30" cy="25" r="1" fill="#6aae5a" opacity=".4"/>
      <circle cx="20" cy="35" r="1.2" fill="#4a8e3a" opacity=".3"/>
      <circle cx="5" cy="30" r=".8" fill="#3a7e2a" opacity=".4"/>
    </pattern>
    <pattern id="earth" patternUnits="userSpaceOnUse" width="30" height="30">
      <rect width="30" height="30" fill="#C4A882"/>
      <circle cx="8" cy="8" r="1" fill="#B49872" opacity=".5"/>
      <circle cx="22" cy="20" r=".8" fill="#D4B892" opacity=".4"/>
    </pattern>
    <pattern id="trees" patternUnits="userSpaceOnUse" width="60" height="60">
      <rect width="60" height="60" fill="#3d7a3d"/>
      <circle cx="15" cy="15" r="10" fill="#2d6a2d" opacity=".7"/>
      <circle cx="45" cy="40" r="12" fill="#4d8a4d" opacity=".6"/>
      <circle cx="30" cy="50" r="8" fill="#2d6a2d" opacity=".5"/>
    </pattern>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#5a9e4a" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity=".2"/>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity=".15"/>
    </filter>
  </defs>

  <!-- Fondo general: terreno verde con cerros -->
  <rect width="2400" height="1600" fill="url(#grass)"/>
  
  <!-- Cerros de fondo (paisaje) -->
  <path d="M0,200 Q300,80 600,180 Q900,60 1200,150 Q1500,50 1800,130 Q2100,70 2400,160 V0 H0 Z" fill="#3d7a3d" opacity=".4"/>
  <path d="M0,280 Q400,180 800,250 Q1200,150 1600,230 Q2000,170 2400,220 V0 H0 Z" fill="#4a8a4a" opacity=".3"/>
  
  <!-- Áreas de árboles/vegetación -->
  <!-- Zona norte (arriba) - bosque -->
  <ellipse cx="300" cy="250" rx="200" ry="100" fill="url(#trees)" opacity=".7"/>
  <ellipse cx="2100" cy="200" rx="180" ry="90" fill="url(#trees)" opacity=".7"/>
  <ellipse cx="1200" cy="150" rx="250" ry="80" fill="url(#trees)" opacity=".6"/>
  
  <!-- Árboles decorativos dispersos -->
  <g fill="#2d6a2d" opacity=".8">
    <circle cx="150" cy="400" r="25"/><circle cx="160" cy="385" r="20"/>
    <circle cx="2250" cy="350" r="30"/><circle cx="2240" cy="330" r="22"/>
    <circle cx="100" cy="900" r="28"/><circle cx="115" cy="880" r="20"/>
    <circle cx="2300" cy="800" r="25"/><circle cx="2310" cy="785" r="18"/>
    <circle cx="180" cy="1300" r="22"/><circle cx="2220" cy="1250" r="26"/>
    <circle cx="350" cy="1400" r="20"/><circle cx="2050" cy="1350" r="24"/>
  </g>
  
  <!-- CALLES PRINCIPALES -->
  <!-- Roberto Bravo (calle principal horizontal) -->
  <path d="M200,750 Q600,740 1000,750 Q1400,760 1800,755 Q2000,750 2200,750" 
        stroke="#C4A882" stroke-width="50" fill="none" stroke-linecap="round"/>
  <path d="M200,750 Q600,740 1000,750 Q1400,760 1800,755 Q2000,750 2200,750" 
        stroke="#DDD0B8" stroke-width="3" fill="none" stroke-dasharray="20,15" opacity=".6"/>
  
  <!-- San Antonio (segunda calle horizontal más abajo) -->
  <path d="M300,1050 Q700,1040 1100,1050 Q1500,1060 1900,1055 Q2100,1050 2200,1050" 
        stroke="#C4A882" stroke-width="45" fill="none" stroke-linecap="round"/>
  <path d="M300,1050 Q700,1040 1100,1050 Q1500,1060 1900,1055 Q2100,1050 2200,1050" 
        stroke="#DDD0B8" stroke-width="3" fill="none" stroke-dasharray="18,12" opacity=".6"/>
        
  <!-- Manuel Rodríguez (calle horizontal superior) -->
  <path d="M400,500 Q800,490 1200,500 Q1600,510 2000,505" 
        stroke="#C4A882" stroke-width="40" fill="none" stroke-linecap="round"/>
  
  <!-- Arturo Prat (calle vertical izquierda) -->
  <path d="M600,350 Q610,600 600,800 Q595,1000 600,1300" 
        stroke="#C4A882" stroke-width="40" fill="none" stroke-linecap="round"/>
  
  <!-- Bernardo O'Higgins (calle vertical) -->
  <path d="M1000,300 Q1010,550 1000,800 Q995,1050 1000,1350" 
        stroke="#C4A882" stroke-width="40" fill="none" stroke-linecap="round"/>
  
  <!-- General Baquedano (calle vertical derecha) -->
  <path d="M1500,350 Q1510,600 1500,850 Q1495,1100 1500,1400" 
        stroke="#C4A882" stroke-width="38" fill="none" stroke-linecap="round"/>
  
  <!-- El Carmen (calle vertical lejana) -->
  <path d="M1900,400 Q1910,650 1900,900 Q1895,1150 1900,1350" 
        stroke="#C4A882" stroke-width="35" fill="none" stroke-linecap="round"/>

  <!-- Conexiones entre calles -->
  <path d="M800,500 L800,750" stroke="#C4A882" stroke-width="30" fill="none" stroke-linecap="round"/>
  <path d="M1200,500 L1200,750" stroke="#C4A882" stroke-width="30" fill="none" stroke-linecap="round"/>
  <path d="M1700,500 L1700,750" stroke="#C4A882" stroke-width="28" fill="none" stroke-linecap="round"/>
  
  <!-- PLAZA DE POMAIRE (centro) -->
  <g filter="url(#shadow)">
    <rect x="880" y="850" width="240" height="200" rx="20" fill="#7ab06a"/>
    <rect x="900" y="870" width="200" height="160" rx="12" fill="#8ec07c"/>
    <!-- Árboles de la plaza -->
    <circle cx="940" cy="920" r="15" fill="#3d7a3d"/>
    <circle cx="1060" cy="920" r="15" fill="#3d7a3d"/>
    <circle cx="940" cy="990" r="12" fill="#4a8a4a"/>
    <circle cx="1060" cy="990" r="12" fill="#4a8a4a"/>
    <!-- Fuente central -->
    <circle cx="1000" cy="950" r="20" fill="#7cb8d4" stroke="#5a98b4" stroke-width="3"/>
    <circle cx="1000" cy="950" r="8" fill="#9cd8f4"/>
  </g>
  
  <!-- IGLESIA (junto a la plaza) -->
  <g filter="url(#softShadow)" transform="translate(1900,820)">
    <rect x="0" y="20" width="60" height="80" rx="4" fill="#F5E6D3"/>
    <polygon points="30,-10 0,20 60,20" fill="#8B4513"/>
    <rect x="24" y="50" width="12" height="30" fill="#5C3420"/>
    <circle cx="30" cy="5" r="5" fill="#E8A838"/>
    <!-- Cruz -->
    <rect x="28" y="-18" width="4" height="12" fill="#E8A838"/>
    <rect x="24" y="-14" width="12" height="4" fill="#E8A838"/>
  </g>
  
  <!-- EDIFICIOS ILUSTRADOS (estilo rústico isométrico) -->
  
  <!-- Galería de alfarería 1 -->
  <g filter="url(#softShadow)" transform="translate(400,680)">
    <rect width="80" height="60" rx="4" fill="#E8D4B8"/>
    <polygon points="0,0 40,-20 80,0" fill="#B85C2C"/>
    <rect x="30" y="25" width="20" height="35" fill="#8B4513"/>
    <rect x="10" y="15" width="15" height="15" fill="#87CEEB" opacity=".7"/>
    <rect x="55" y="15" width="15" height="15" fill="#87CEEB" opacity=".7"/>
    <!-- Vasijas decorativas -->
    <ellipse cx="15" cy="62" rx="6" ry="8" fill="#D4654A"/>
    <ellipse cx="65" cy="62" rx="5" ry="7" fill="#B85C2C"/>
  </g>
  
  <!-- Restaurante grande -->
  <g filter="url(#softShadow)" transform="translate(700,680)">
    <rect width="100" height="65" rx="5" fill="#F5E6D3"/>
    <polygon points="0,0 50,-25 100,0" fill="#8B4513"/>
    <rect x="40" y="30" width="20" height="35" fill="#5C3420"/>
    <rect x="10" y="15" width="18" height="18" fill="#87CEEB" opacity=".7"/>
    <rect x="72" y="15" width="18" height="18" fill="#87CEEB" opacity=".7"/>
    <!-- Letrero -->
    <rect x="25" y="-8" width="50" height="12" rx="3" fill="#D4654A"/>
    <!-- Mesas afuera -->
    <circle cx="20" cy="75" r="5" fill="#C4A882"/>
    <circle cx="80" cy="75" r="5" fill="#C4A882"/>
  </g>
  
  <!-- Taller de alfarería -->
  <g filter="url(#softShadow)" transform="translate(1100,680)">
    <rect width="70" height="55" rx="4" fill="#E0C8A8"/>
    <polygon points="0,0 35,-18 70,0" fill="#A0522D"/>
    <rect x="25" y="20" width="20" height="35" fill="#6B3A1F"/>
    <!-- Torno visible -->
    <circle cx="55" cy="40" r="8" fill="#D4654A" opacity=".8"/>
    <!-- Chimenea -->
    <rect x="55" y="-25" width="8" height="18" fill="#666"/>
    <!-- Humo -->
    <path d="M59,-25 Q62,-35 58,-42 Q63,-50 60,-55" fill="none" stroke="#999" stroke-width="2" opacity=".5"/>
  </g>
  
  <!-- Vivero / Jardín -->
  <g filter="url(#softShadow)" transform="translate(500,980)">
    <rect width="90" height="50" rx="4" fill="#F5E6D3"/>
    <polygon points="0,0 45,-15 90,0" fill="#4a8a4a"/>
    <!-- Plantas -->
    <circle cx="15" cy="55" r="8" fill="#3d7a3d"/>
    <circle cx="35" cy="58" r="6" fill="#5a9e4a"/>
    <circle cx="55" cy="55" r="7" fill="#2d6a2d"/>
    <circle cx="75" cy="57" r="5" fill="#4a8a4a"/>
  </g>
  
  <!-- Hostal / Alojamiento -->
  <g filter="url(#softShadow)" transform="translate(1400,680)">
    <rect width="85" height="70" rx="4" fill="#F0E0C8"/>
    <rect width="85" height="35" y="-35" rx="4" fill="#F0E0C8"/>
    <polygon points="0,-35 42,-55 85,-35" fill="#D4654A"/>
    <rect x="32" y="30" width="20" height="40" fill="#5C3420"/>
    <rect x="10" y="-20" width="14" height="14" fill="#87CEEB" opacity=".7"/>
    <rect x="60" y="-20" width="14" height="14" fill="#87CEEB" opacity=".7"/>
    <rect x="10" y="15" width="14" height="14" fill="#87CEEB" opacity=".7"/>
    <rect x="60" y="15" width="14" height="14" fill="#87CEEB" opacity=".7"/>
  </g>
  
  <!-- El Chancho gigante (atracción) -->
  <g filter="url(#shadow)" transform="translate(1700,950)">
    <!-- Base/plataforma -->
    <rect x="-20" y="30" width="120" height="20" rx="8" fill="#C4A882"/>
    <!-- Chancho de greda gigante -->
    <ellipse cx="40" cy="20" rx="35" ry="25" fill="#D4654A"/>
    <ellipse cx="40" cy="10" rx="30" ry="20" fill="#E07050"/>
    <circle cx="28" cy="5" r="3" fill="#2D1A0A"/>
    <circle cx="52" cy="5" r="3" fill="#2D1A0A"/>
    <ellipse cx="40" cy="15" rx="8" ry="5" fill="#B84A32"/>
    <!-- Ranura del chancho-alcancía -->
    <rect x="30" y="-8" width="20" height="4" rx="2" fill="#8B4513"/>
    <!-- Estrellitas (atracción premium) -->
    <text x="40" y="-20" text-anchor="middle" font-size="14" fill="#E8A838">⭐</text>
  </g>
  
  <!-- Cervecería -->
  <g filter="url(#softShadow)" transform="translate(1600,450)">
    <rect width="70" height="55" rx="4" fill="#F5E6D3"/>
    <polygon points="0,0 35,-18 70,0" fill="#5C3420"/>
    <rect x="25" y="20" width="18" height="35" fill="#6B3A1F"/>
    <!-- Barril -->
    <ellipse cx="58" cy="45" rx="8" ry="10" fill="#8B4513"/>
    <rect x="52" y="35" width="12" height="20" rx="6" fill="#A0522D"/>
  </g>
  
  <!-- Estacionamiento -->
  <g filter="url(#softShadow)" transform="translate(300,1200)">
    <rect width="120" height="80" rx="6" fill="#888"/>
    <rect x="5" y="5" width="110" height="70" rx="4" fill="#666"/>
    <!-- Líneas de estacionamiento -->
    <rect x="15" y="15" width="20" height="40" rx="2" fill="#888" stroke="#fff" stroke-width="1"/>
    <rect x="45" y="15" width="20" height="40" rx="2" fill="#888" stroke="#fff" stroke-width="1"/>
    <rect x="75" y="15" width="20" height="40" rx="2" fill="#888" stroke="#fff" stroke-width="1"/>
    <!-- Autos -->
    <rect x="18" y="22" width="14" height="28" rx="4" fill="#3498db"/>
    <rect x="78" y="22" width="14" height="28" rx="4" fill="#e74c3c"/>
    <!-- Señal P -->
    <text x="60" y="72" text-anchor="middle" font-size="16" font-weight="bold" fill="#fff">🅿️</text>
  </g>
  
  <!-- Carabineros -->
  <g filter="url(#softShadow)" transform="translate(1300,1000)">
    <rect width="70" height="55" rx="4" fill="#E8E8E8"/>
    <polygon points="0,0 35,-18 70,0" fill="#2E8B57"/>
    <rect x="25" y="20" width="18" height="35" fill="#5C3420"/>
    <!-- Bandera chilena -->
    <rect x="58" y="-20" width="2" height="30" fill="#666"/>
    <rect x="60" y="-20" width="15" height="10" fill="#fff"/>
    <rect x="60" y="-20" width="7" height="5" fill="#003DA5"/>
    <rect x="60" y="-15" width="15" height="5" fill="#D52B1E"/>
  </g>
  
  <!-- CESFAM (Centro de salud) -->
  <g filter="url(#softShadow)" transform="translate(1800,480)">
    <rect width="80" height="55" rx="4" fill="#FFF"/>
    <polygon points="0,0 40,-18 80,0" fill="#E25555"/>
    <rect x="30" y="20" width="18" height="35" fill="#5C3420"/>
    <!-- Cruz roja -->
    <rect x="34" y="-12" width="12" height="4" fill="#E25555"/>
    <rect x="38" y="-16" width="4" height="12" fill="#E25555"/>
  </g>
  
  <!-- El Cristo (mirador) -->
  <g filter="url(#shadow)" transform="translate(200,350)">
    <path d="M30,80 Q30,50 30,30" stroke="#999" stroke-width="4" fill="none"/>
    <rect x="20" y="20" width="20" height="4" fill="#999"/>
    <rect x="27" y="10" width="6" height="20" fill="#999"/>
    <!-- Cerro -->
    <path d="M0,80 Q30,40 60,80 Z" fill="#5a9e4a"/>
  </g>
  
  <!-- Letreros de calles -->
  <g font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#5C3420">
    <text x="1000" y="730" text-anchor="middle" transform="rotate(-1 1000 730)">Calle Roberto Bravo</text>
    <text x="1000" y="1030" text-anchor="middle">Calle San Antonio</text>
    <text x="800" y="480" text-anchor="middle">Calle Manuel Rodríguez</text>
    <text x="580" y="600" text-anchor="middle" transform="rotate(-85 580 600)">Arturo Prat</text>
    <text x="985" y="600" text-anchor="middle" transform="rotate(-87 985 600)">B. O'Higgins</text>
    <text x="1485" y="600" text-anchor="middle" transform="rotate(-87 1485 600)">Gral. Baquedano</text>
    <text x="1885" y="600" text-anchor="middle" transform="rotate(-87 1885 600)">El Carmen</text>
  </g>
  
  <!-- Letrero Plaza -->
  <g transform="translate(1000,870)">
    <rect x="-50" y="-12" width="100" height="24" rx="12" fill="rgba(45,26,10,.8)"/>
    <text x="0" y="5" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#fff">Plaza de Pomaire</text>
  </g>
  
  <!-- Brújula decorativa -->
  <g transform="translate(2280,120)">
    <circle cx="0" cy="0" r="40" fill="rgba(255,255,255,.85)" stroke="#C4A882" stroke-width="3"/>
    <polygon points="0,-30 5,-5 0,-10 -5,-5" fill="#D4654A"/>
    <polygon points="0,30 5,5 0,10 -5,5" fill="#888"/>
    <polygon points="-30,0 -5,5 -10,0 -5,-5" fill="#888"/>
    <polygon points="30,0 5,5 10,0 5,-5" fill="#888"/>
    <text x="0" y="-32" text-anchor="middle" font-size="10" font-weight="700" fill="#D4654A">N</text>
    <text x="0" y="40" text-anchor="middle" font-size="9" fill="#888">S</text>
    <text x="35" y="4" text-anchor="middle" font-size="9" fill="#888">E</text>
    <text x="-35" y="4" text-anchor="middle" font-size="9" fill="#888">O</text>
  </g>
  
  <!-- Título del mapa -->
  <g transform="translate(120,80)">
    <rect x="0" y="0" width="320" height="70" rx="15" fill="rgba(255,255,255,.9)" stroke="#C4A882" stroke-width="2"/>
    <text x="160" y="30" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="800" fill="#2D1A0A">🏺 Mapa de Pomaire</text>
    <text x="160" y="52" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#8A7E76">Pueblo Alfarero de Chile</text>
  </g>
  
  <!-- Decoración: viñetas y bordes -->
  <rect x="10" y="10" width="2380" height="1580" rx="20" fill="none" stroke="#C4A882" stroke-width="4" stroke-dasharray="0" opacity=".4"/>
  <rect x="20" y="20" width="2360" height="1560" rx="16" fill="none" stroke="#C4A882" stroke-width="1" opacity=".2"/>
</svg>
